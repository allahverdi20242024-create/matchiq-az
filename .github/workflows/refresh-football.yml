name: Refresh football data

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: matchiq-production-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wake backend and verify fixture freshness
        shell: bash
        run: |
          set -euo pipefail
          api="https://matchiq-az-api.onrender.com"
          fetch() {
            curl --fail --silent --show-error --retry 2 --retry-delay 5 --retry-all-errors --max-time 65 "$api$1"
          }
          fetch /healthz | jq -e '.status == "ok"' >/dev/null
          for attempt in {1..12}; do
            if feed="$(fetch '/v1/fixtures?view=results')"; then
              cutoff="$(date -u -d '5 hours ago' +%Y-%m-%dT%H:%M:%S)"
              if jq -e --arg cutoff "$cutoff" '
                (.competitions // []) as $groups
                | ($groups | length > 0)
                  and (($groups | map(.fetched_at[:19] < $cutoff) | any) | not)
                  and ((.syncing // []) | length == 0)
              ' <<<"$feed" >/dev/null; then
                {
                  echo '### MatchIQ AZ data freshness (UTC)'
                  jq -r '.competitions[] | "- \(.competition): \(.fetched_at) (\(.source))"' <<<"$feed"
                  jq -r '(.unavailable // [])[] | "- Unavailable: \(.)"' <<<"$feed"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            if (( attempt < 12 )); then sleep 10; fi
          done
          echo "Fixture freshness could not be verified for all available competitions." >&2
          exit 1
      - name: Verify recorded forecasts against final scores
        shell: bash
        run: |
          set -euo pipefail
          api="https://matchiq-az-api.onrender.com"
          fetch() {
            curl --fail --silent --show-error --retry 2 --retry-delay 5 --retry-all-errors --max-time 30 "$api$1"
          }
          feed="$(fetch '/v1/fixtures?view=results')"
          archive="$(fetch /v1/prediction-history)"
          report="$(jq -n --slurpfile feed <(printf '%s\n' "$feed") --slurpfile archive <(printf '%s\n' "$archive") '
            def fixture_key($competition; $id): [$competition, $id] | @json;
            (reduce ($feed[0].competitions[] as $group | $group.matches[] | select(.score != null)) as $match
              ({}; .[fixture_key($match.competition; $match.id)] = $match.score)) as $scores
            | [$archive[0].recent[]
              | $scores[fixture_key(.competition; .fixture_id)] as $expected
              | select($expected != null)
              | {fixture_id: .fixture_id, expected: $expected, recorded: .score}]
          ')"
          {
            echo '### MatchIQ AZ forecast archive'
            echo "- Settled forecasts: $(jq -r '.settled' <<<"$archive")"
            echo "- Recent forecasts checked against provider results: $(jq 'length' <<<"$report")"
            jq -r '.[] | select(.expected != .recorded) | "- Score mismatch: \(.fixture_id), provider \(.expected | @json), archive \(.recorded | @json)"' <<<"$report"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -e 'all(.[]; .expected == .recorded)' <<<"$report" >/dev/null
