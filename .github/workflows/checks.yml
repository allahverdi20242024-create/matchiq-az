name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:routes

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: matchiq_test
          POSTGRES_USER: matchiq
          POSTGRES_PASSWORD: matchiq-ci-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U matchiq -d matchiq_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q backend -o pythonpath=backend
        env:
          TEST_POSTGRES_DSN: postgresql://matchiq:matchiq-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/matchiq_test
      - name: Start the Compose stack
        run: |
          docker compose config --quiet
          docker compose up --build --wait
          curl --fail --silent --show-error --retry 12 --retry-connrefused http://127.0.0.1:8000/healthz
          curl --fail --silent --show-error http://127.0.0.1:8000/v1/fixtures >/dev/null
        env:
          POSTGRES_PASSWORD: matchiq-ci-only
          DATABASE_URL: postgresql://matchiq:matchiq-ci-only@db:5432/matchiq
      - name: Stop the CI Compose stack
        if: always()
        run: docker compose down --volumes
        env:
          POSTGRES_PASSWORD: matchiq-ci-only
          DATABASE_URL: postgresql://matchiq:matchiq-ci-only@db:5432/matchiq
